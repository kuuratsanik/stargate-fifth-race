name: Validate Canon

on:
  push:
    paths:
      - '00-canon/**'
      - 'notion-templates/**'
      - 'scripts/**'
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canon
        run: python scripts/validate_canon_v2.py
