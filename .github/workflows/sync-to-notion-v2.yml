name: Sync Canon to Notion (v2)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no Notion writes)"
        type: boolean
        default: true
      targets:
        description: "Comma-separated targets"
        type: string
        default: "episodes,characters,ships,tech,locations,continuity"
  push:
    branches: [main]
    paths:
      - "00-canon/**"
      - "notion-templates/**"
      - "scripts/sync_all_to_notion.py"
      - "scripts/validate_canon_v2.py"
  schedule:
    - cron: "0 6 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canon CSVs
        run: python scripts/validate_canon_v2.py

  sync:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Sync to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_EPISODES_DATA_SOURCE_ID: ${{ secrets.NOTION_EPISODES_DATA_SOURCE_ID }}
          NOTION_CHARACTERS_DATA_SOURCE_ID: ${{ secrets.NOTION_CHARACTERS_DATA_SOURCE_ID }}
          NOTION_SHIPS_DATA_SOURCE_ID: ${{ secrets.NOTION_SHIPS_DATA_SOURCE_ID }}
          NOTION_TECH_DATA_SOURCE_ID: ${{ secrets.NOTION_TECH_DATA_SOURCE_ID }}
          NOTION_LOCATIONS_DATA_SOURCE_ID: ${{ secrets.NOTION_LOCATIONS_DATA_SOURCE_ID }}
          NOTION_CONTINUITY_DATA_SOURCE_ID: ${{ secrets.NOTION_CONTINUITY_DATA_SOURCE_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          SYNC_TARGETS: ${{ github.event.inputs.targets || 'episodes,characters,ships,tech,locations,continuity' }}
        run: python scripts/sync_all_to_notion.py
